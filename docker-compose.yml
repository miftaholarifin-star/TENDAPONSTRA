services:
  tendaponstra-api:
    build: .
    container_name: tendaponstra-api
    environment:
      TENDAPONSTRA_DATABASE_PATH: /app/data/tendaponstra.db
      TENDAPONSTRA_ALLOWED_ORIGINS: http://127.0.0.1:5500,http://localhost:5500
    ports:
      - "8000:8000"
    volumes:
      - tendaponstra-data:/app/data
    restart: unless-stopped

  tendaponstra-dashboard:
    image: nginx:1.27-alpine
    container_name: tendaponstra-dashboard
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - tendaponstra-api
    restart: unless-stopped

volumes:
  tendaponstra-data:

